name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Pomidor Cam APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses via runner sdkmanager
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_DIR" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER (SDK_DIR=$SDK_DIR)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null
          ls -la "$SDK_DIR/licenses"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          GRADLE_CMD=$([ -x ./gradlew ] && echo "./gradlew" || echo "gradle")
          $GRADLE_CMD :app:testDebugUnitTest \
            --tests "com.example.PomodoroSessionEngineTest" \
            --tests "com.example.WorkdayClockAndReportTest" \
            --tests "com.example.Yolo26DecoderTest" \
            --tests "com.example.CameraCatalogAndTorchTest" \
            --tests "com.example.MorningAutoExportTest"

      - name: Build APK
        id: build_apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_CMD=$([ -x ./gradlew ] && echo "./gradlew" || echo "gradle")
          mkdir -p release-artifacts
          TAG="${{ steps.meta.outputs.tag }}"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release keystore secret detected — building signed release APK"
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
            $GRADLE_CMD :app:assembleRelease
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            APK_OUT="release-artifacts/PomidorCam-${TAG}-release.apk"
            echo "signing_mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not configured — building installable APK signed with debug.keystore"
            $GRADLE_CMD :app:assembleDebug
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            APK_OUT="release-artifacts/PomidorCam-${TAG}.apk"
            echo "signing_mode=debug" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "APK artifact was not generated" >&2
            exit 1
          fi

          cp "$APK_SRC" "$APK_OUT"
          ls -lh "$APK_OUT"

      - name: Upload workflow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomidor-cam-apk-${{ steps.meta.outputs.tag }}
          path: release-artifacts/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Pomidor Cam ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*.apk
